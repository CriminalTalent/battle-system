<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>관전자</title>
<script src="/socket.io/socket.io.js"></script>
<link href="/assets/css/battle-theme.css" rel="stylesheet">
<script src="/assets/js/battle-ui.js"></script>
</head>
<body class="page-spectator">
<div class="container">
  <header class="topbar">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 17.5 21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4M5 21l-2-2"/></svg></span><span class="brand-title">전투 시스템</span></div>
    <div class="chips" data-battle-chips></div>
    <div class="topbar-spacer"></div>
    <button type="button" class="icon-btn theme-toggle" aria-label="화면 테마 전환" title="화면 테마 전환">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  </header>

  <div class="main-grid">
    <div>
      <div class="team-container team-a">
        <div class="team-title" data-team-name="A">A팀</div>
        <div id="teamA"></div>
      </div>

      <div class="card">
        <div class="title">실시간 로그</div>
        <div class="logs-section" id="logPanel"></div>
      </div>
    </div>

    <div>
      <div class="card battle-main">
        <div class="current-player-info">
          <div id="currentStage" class="stage current-stage"></div>
          <div id="turnInfo" class="turn-info">대기 중...</div>
          <div id="timerDisplay" class="timer-display">0:00</div>
          <div id="timerSeconds" class="timer-seconds">0초</div>
        </div>
      </div>

      <div class="card">
        <div class="title">응원하기</div>
        <div class="cheer-grid">
          <button class="cheer-btn" data-msg="멋지다!">멋지다!</button>
          <button class="cheer-btn" data-msg="이겨라!">이겨라!</button>
          <button class="cheer-btn" data-msg="살아서 돌아와!">살아서 돌아와!</button>
          <button class="cheer-btn" data-msg="화이팅!">화이팅!</button>
          <button class="cheer-btn" data-msg="죽으면 나한테 죽어!">죽으면 나한테 죽어!</button>
          <button class="cheer-btn" data-msg="힘내요!">힘내요!</button>
        </div>
      </div>
    </div>

    <div>
      <div class="team-container team-b">
        <div class="team-title" data-team-name="B">B팀</div>
        <div id="teamB"></div>
      </div>

      <div class="card">
        <div class="title">채팅</div>
        <div class="chat-section" id="chatPanel"></div>
      </div>
    </div>
  </div>
</div>

<div id="nameOverlay" class="name-overlay">
  <div class="name-box">
    <h2>관전자 이름 입력</h2>
    <input id="nameInput" type="text" maxlength="20" placeholder="관전자 이름" class="name-input"/>
    <button id="enterBtn" class="enter-btn" type="button">입장하기</button>
  </div>
</div>

<!-- 게임 종료 오버레이 -->
<div id="gameOver" class="game-over-overlay" aria-hidden="true">
  <div class="game-over-box">
    <div class="game-over-title">전투가 종료되었습니다.</div>
    <div class="game-over-winner" id="winnerText"></div>
  </div>
</div>

<script>
(()=> {
  // battle 파라미터 호환(battle|battleId|bid)
  const qs = new URLSearchParams(location.search);
  const battleId = qs.get('battle') || qs.get('battleId') || qs.get('bid');
  if (!battleId) { alert('올바르지 않은 URL입니다'); return; }
  try{
    const u=new URL(location.href);
    u.searchParams.set('battle',battleId);
    ['battleId','bid'].forEach(k=>u.searchParams.delete(k));
    history.replaceState(null,'',u.toString());
  }catch{}

  const socket = io({ path: '/socket.io' });
  const logPanel  = document.getElementById('logPanel');
  const chatPanel = document.getElementById('chatPanel');

  let spectatorName = '';
  let battle = null;
  let currentPhase = null;
  const bufferedResolutionLogs = [];

  let timerDisplayLeft = 0;
  let timerTick = null;

  let gameOverShown = false;

  const tn = t => window.BattleUI ? BattleUI.teamName(t) : (t === 'A' ? 'A팀' : t === 'B' ? 'B팀' : String(t ?? ''));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function classForLog(type, message){
    if (type === 'teamA') return 'log-team-a';
    if (type === 'teamB') return 'log-team-b';
    if (type === 'result') return 'log-result';
    if (type === 'notice') return 'log-notice';
    if (type === 'error')  return 'log-error';
    if (type === 'system') return 'log-system';
    const m = message||'';
    if (/(^|\s)A[1-4]\b|A팀/.test(m)) return 'log-team-a';
    if (/(^|\s)B[1-4]\b|B팀/.test(m)) return 'log-team-b';
    if (/라운드 해석|승리|결과|===/.test(m)) return 'log-result';
    return 'log-system';
  }

  function stripDetail(msg){
    return msg
      .replace(/\s*\(피해\s*[\d]+\)\s*→\s*HP\s*[\d]+/g,'')
      .replace(/\s*\(회복\s*[\d]+\)\s*→\s*HP\s*[\d]+/g,'')
      .replace(/\s*→\s*HP\s*[\d]+/g,'');
  }

  function pushLog(text, cls='log-system', ts){
    const time = new Date(ts||Date.now()).toLocaleTimeString('ko-KR',{hour12:false});
    const div = document.createElement('div');
    div.className = `log-item ${cls}`;
    div.innerHTML = `<span class="log-time">[${time}]</span> ${esc(text)}`;
    logPanel.appendChild(div);
    logPanel.scrollTop = logPanel.scrollHeight;
    while (logPanel.children.length > 700) logPanel.removeChild(logPanel.firstChild);
  }

  function addLog({ts, type, message}){
    if (!message) return;

    const phase = battle?.phase || currentPhase;
    const isSelect = (phase === 'A_select' || phase === 'B_select');
    const hasDetail = /(피해\s*\d+|회복\s*\d+|→\s*HP\s*\d+)/.test(message);

    if (isSelect && hasDetail) {
      pushLog(stripDetail(message), classForLog(type, message), ts);
      bufferedResolutionLogs.push({ ts, text: message });
      return;
    }
    if (message.includes('라운드 해석')) {
      pushLog('라운드 해석', 'log-result', ts);
      bufferedResolutionLogs.forEach(x => pushLog(x.text, 'log-result', x.ts));
      bufferedResolutionLogs.length = 0;
      return;
    }
    pushLog(message, classForLog(type, message), ts);
  }

  function addChat({name, message}){
    if (!name || !message) return;
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.innerHTML = `<span class="chat-name">${esc(name)}</span>: ${esc(message)}`;
    chatPanel.appendChild(div);
    chatPanel.scrollTop = chatPanel.scrollHeight;
    while (chatPanel.children.length > 300) chatPanel.removeChild(chatPanel.firstChild);
  }

  function renderTeams(){
    if(!battle?.players) return;
    const teamA = battle.players.filter(p=>p.team==='A');
    const teamB = battle.players.filter(p=>p.team==='B');
    const render = (list, id)=>{
      let html = '';
      list.forEach(p=>{
        const hpPct = Math.max(0, Math.min(100, p.hp/(p.maxHp||100)*100));
        const ready = p.ready ? '준비완료' : '대기중';
        const isCur = battle?.currentTurn?.currentPlayer?.id === p.id;
        const hpCls = window.BattleUI ? BattleUI.hpClass(hpPct) : '';
        html += `
        <div class="player-card ${p.hp>0?'':'dead'} ${isCur?'is-current':''}">
          <img src="${p.avatar||''}" class="player-avatar" alt="${esc(p.name)}"
               onerror="this.removeAttribute('src')"/>
          <div class="player-info">
            <div class="player-name">${esc(p.name)}</div>
            <div class="hp"><span class="${hpCls}" style="width:${hpPct}%"></span></div>
            <div class="hp-text">HP ${p.hp}/${p.maxHp||100}</div>
            <div class="stats">공${p.stats?.attack||0} 방${p.stats?.defense||0} 민${p.stats?.agility||0} 행${p.stats?.luck||0}</div>
            <div class="ready-status">${ready}</div>
          </div>
        </div>`;
      });
      document.getElementById(id).innerHTML = html;
    };
    render(teamA,'teamA');
    render(teamB,'teamB');
  }

  /* 타이머(1초 감산, inter는 최소 5초 보장) */
  function startLocalTimer(seconds){
    clearInterval(timerTick);
    const phase = battle?.phase;
    let startSec = Math.max(0, seconds|0);
    if (phase === 'inter' && startSec < 5) startSec = 5;

    timerDisplayLeft = startSec;
    drawTimer(timerDisplayLeft);
    timerTick = setInterval(()=>{
      if (timerDisplayLeft > 0) {
        timerDisplayLeft -= 1;
        drawTimer(timerDisplayLeft);
      }
    }, 1000);
  }
  function drawTimer(t){
    const mm = Math.floor(t/60);
    const ss = String(t%60).padStart(2,'0');
    document.getElementById('timerDisplay').textContent = `${mm}:${ss}`;
    document.getElementById('timerSeconds').textContent = `${t}초`;
    const ph = battle?.phase;
    document.getElementById('timerDisplay').classList.toggle('urgent',
      t > 0 && t <= 10 && battle?.status === 'active' && (ph === 'A_select' || ph === 'B_select'));
  }

  function renderCenter(){
    const turn = battle?.currentTurn || {};
    const current = turn.currentPlayer;
    const info = document.getElementById('turnInfo');

    const phaseText =
      battle?.phase === 'A_select' ? `${tn('A')} 선택 중` :
      battle?.phase === 'B_select' ? `${tn('B')} 선택 중` :
      battle?.phase === 'resolve'  ? '라운드 해석 중' :
      battle?.phase === 'inter'    ? '다음 라운드 대기' : '대기중';

    info.textContent = (current && current.name) ? `${phaseText} - ${current.name} 차례` : phaseText;
    // 현재 플레이어가 없으면 대기 이미지
    if (window.BattleUI) BattleUI.renderStage(document.getElementById('currentStage'), battle);

    startLocalTimer(turn.timeLeftSec||0);
  }

  function renderAll(){
    if (window.BattleUI) { BattleUI.applyTeamNames(battle); BattleUI.renderChips(battle); }
    if (battle?.phase && battle.phase !== currentPhase) {
      currentPhase = battle.phase;
      if (currentPhase === 'resolve' && bufferedResolutionLogs.length) {
        pushLog('라운드 해석', 'log-result');
        bufferedResolutionLogs.forEach(x => pushLog(x.text, 'log-result', x.ts));
        bufferedResolutionLogs.length = 0;
      }
    }
    renderCenter();
    renderTeams();
    maybeShowGameOverByStatus();
  }

  // 이름 입력 → 채팅용
  document.getElementById('enterBtn').onclick = ()=>{
    const v = document.getElementById('nameInput').value.trim();
    if (!v) { alert('이름을 입력하세요'); return; }
    spectatorName = v;
    document.getElementById('nameOverlay').style.display = 'none';
  };
  document.getElementById('nameInput').addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){ e.preventDefault(); document.getElementById('enterBtn').click(); }
  });

  // 응원 버튼 → 일반 채팅으로 송출(중복 제거 없이 계속 보이게)
  document.addEventListener('click',(e)=>{
    const b=e.target.closest('.cheer-btn');
    if(!b) return;
    const msg=b.getAttribute('data-msg');
    socket.emit('chatMessage',{battleId,name:spectatorName||'관전자',message:msg,type:'cheer'});
  });

  // 소켓
  socket.on('connect', ()=>{ socket.emit('join',{battleId}); });
  const onSnap = (snap)=>{ battle=snap; renderAll(); };
  socket.on('battle:update', onSnap);
  socket.on('battle:log', addLog);
  socket.on('chatMessage', addChat);

  // === 종료 오버레이 표시 ===
  function showGameOverOverlay(winnerTeam){
    if (gameOverShown) return;
    gameOverShown = true;
    const ov = document.getElementById('gameOver');
    if (window.BattleUI) {
      BattleUI.fillVictory(ov, winnerTeam, battle);
    } else {
      document.getElementById('winnerText').textContent = winnerTeam === 'A' ? 'A팀 승리' : winnerTeam === 'B' ? 'B팀 승리' : '무승부';
      ov.classList.add('show');
    }
    pushLog(`전투 종료: ${window.BattleUI ? BattleUI.winnerText(winnerTeam) : (winnerTeam || '무승부')}`, 'log-winner');
  }
  socket.on('battle:ended', (d)=> showGameOverOverlay(d?.winner ?? battle?.winner));
  socket.on('battleEnded',  (d)=> showGameOverOverlay(d?.winner ?? battle?.winner));

  function maybeShowGameOverByStatus(){
    if (!battle) return;
    if (battle.status === 'ended') {
      showGameOverOverlay(battle.winner);
    }
  }

  // 선택: 데스크톱 알림/효과 모듈이 로드되어 있다면 사용
  if (window.BattleNotify) {
    try { window.BattleNotify.init({ socket, enabled:true, volume:0.5 }); } catch(_) {}
  }
  if (window.BattleEffects) {
    try { window.BattleEffects.init?.(); } catch(_) {}
  }

  document.getElementById('nameInput').focus();
})();
</script>
</body>
</html>
